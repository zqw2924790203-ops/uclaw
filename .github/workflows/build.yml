name: Build

on:
  push:
    branches:
      - master
    paths:
      - "bin/config-server.js"
      - "ModelSwitcher.html"
      - "*.bat"

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate config-server.js syntax
        run: node -c bin/config-server.js
