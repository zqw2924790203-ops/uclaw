<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UClaW — 控制面板</title>
<style>
  :root{--bg:#0a0a0a;--surface:#141414;--card:#1a1a1a;--card-hover:#222;--border:#2a2a2a;
    --text:#e8e8e8;--dim:#888;--accent:#4f9cf7;--green:#34d399;--yellow:#fbbf24;
    --red:#f87171;--purple:#a78bfa;--radius:10px}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh}

  /* Layout */
  .app{display:flex;height:100vh}
  .sidebar{width:200px;background:var(--surface);border-right:1px solid var(--border);
    display:flex;flex-direction:column;flex-shrink:0}
  .sidebar .brand{padding:1.25rem 1rem .75rem;font-weight:700;font-size:1.1rem;
    border-bottom:1px solid var(--border);letter-spacing:-.02em}
  .sidebar .brand span{color:var(--accent)}
  .sidebar nav{flex:1;padding:.5rem 0}
  .nav-item{display:flex;align-items:center;gap:.6rem;padding:.55rem 1rem;cursor:pointer;
    color:var(--dim);font-size:.82rem;transition:all .15s;border-left:2px solid transparent}
  .nav-item:hover{color:var(--text);background:rgba(255,255,255,.03)}
  .nav-item.active{color:var(--accent);background:rgba(79,156,247,.06);border-left-color:var(--accent)}
  .sidebar .version{padding:.75rem 1rem;font-size:.7rem;color:var(--dim);border-top:1px solid var(--border)}

  .main{flex:1;overflow-y:auto;padding:1.5rem 2rem}
  .page-title{font-size:1.15rem;font-weight:600;margin-bottom:1.25rem;display:flex;
    align-items:center;justify-content:space-between}

  /* Status bar */
  .status-bar{display:flex;gap:1rem;align-items:center;margin-bottom:1.25rem}
  .status-chip{display:inline-flex;align-items:center;gap:.35rem;padding:3px 10px;
    border-radius:20px;font-size:.72rem;font-weight:500}
  .status-chip.ok{background:rgba(52,211,153,.1);color:var(--green)}
  .status-chip.err{background:rgba(248,113,113,.1);color:var(--red)}
  .dot{width:6px;height:6px;border-radius:50%}
  .dot.ok{background:var(--green)}.dot.err{background:var(--red)}

  /* Provider cards — CC Switch style */
  .provider-grid{display:flex;flex-direction:column;gap:.5rem}
  .provider-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:.85rem 1rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:.85rem;
    position:relative}
  .provider-card:hover{border-color:#444;background:var(--card-hover)}
  .provider-card.active{border-color:var(--green);background:rgba(52,211,153,.04)}
  .provider-card.active::before{content:'';position:absolute;left:0;top:12px;bottom:12px;
    width:3px;background:var(--green);border-radius:0 2px 2px 0}

  .p-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;
    justify-content:center;font-size:1rem;font-weight:700;color:#fff;flex-shrink:0}
  .p-info{flex:1;min-width:0}
  .p-name{font-weight:600;font-size:.9rem;display:flex;align-items:center;gap:.5rem}
  .p-name .cat{font-size:.65rem;padding:1px 6px;border-radius:8px;background:var(--border);color:var(--dim);font-weight:400}
  .p-name .cat.cn{background:rgba(248,113,113,.12);color:#fca5a5}
  .p-name .cat.proxy{background:rgba(251,191,36,.12);color:#fcd34d}
  .p-name .cat.official{background:rgba(79,156,247,.12);color:#93c5fd}
  .p-url{font-size:.72rem;color:var(--dim);font-family:'SF Mono',Consolas,monospace;
    margin-top:.15rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .p-models{font-size:.72rem;color:var(--dim);margin-top:.15rem}
  .p-right{display:flex;flex-direction:column;align-items:flex-end;gap:.35rem;flex-shrink:0}
  .p-badge{font-size:.65rem;padding:2px 8px;border-radius:10px;font-weight:500}
  .p-badge.active{background:rgba(52,211,153,.15);color:var(--green)}
  .p-badge.key-ok{color:var(--green)}.p-badge.key-miss{color:var(--red)}
  .p-tags{display:flex;gap:.3rem;margin-top:.2rem;flex-wrap:wrap}
  .tag{font-size:.62rem;padding:1px 6px;border-radius:8px;background:rgba(255,255,255,.06);color:var(--dim)}
  .tag.free{background:rgba(52,211,153,.1);color:var(--green)}
  .tag.reasoning{background:rgba(251,191,36,.1);color:var(--yellow)}

  /* Edit panel (inline) */
  .edit-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:1rem;margin-top:.5rem;display:none}
  .edit-panel.open{display:block}
  .edit-row{display:flex;gap:.5rem;align-items:center;margin-bottom:.6rem}
  .edit-row label{font-size:.75rem;color:var(--dim);width:70px;flex-shrink:0;text-align:right}
  .edit-row input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;
    color:var(--text);padding:.4rem .6rem;font-size:.8rem;outline:none;font-family:inherit}
  .edit-row input:focus{border-color:var(--accent)}
  .edit-actions{display:flex;gap:.4rem;justify-content:flex-end;margin-top:.6rem}

  /* Buttons */
  .btn{padding:.4rem .8rem;border-radius:6px;border:1px solid var(--border);background:var(--card);
    color:var(--text);cursor:pointer;font-size:.78rem;transition:all .15s;font-family:inherit}
  .btn:hover{border-color:var(--accent);background:var(--card-hover)}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn-primary:hover{background:#6aabff}
  .btn-sm{padding:.25rem .55rem;font-size:.7rem}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--dim)}
  .btn-ghost:hover{color:var(--text)}
  .btn-danger{color:var(--red);border-color:rgba(248,113,113,.3)}
  .btn-danger:hover{background:rgba(248,113,113,.08)}

  /* Add provider */
  .add-card{border-style:dashed;text-align:center;padding:1rem;color:var(--dim);
    cursor:pointer;transition:all .15s}
  .add-card:hover{border-color:var(--accent);color:var(--accent)}

  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:none;
    align-items:center;justify-content:center}
  .modal-bg.open{display:flex}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:1.25rem;width:440px;max-width:92vw}
  .modal h3{font-size:.95rem;margin-bottom:1rem}
  .modal .form-row{margin-bottom:.8rem}
  .modal .form-label{display:block;font-size:.75rem;color:var(--dim);margin-bottom:.25rem}
  .modal .form-help{font-size:.7rem;color:var(--dim);margin-top:.15rem}
  .modal input,.modal select{width:100%;background:var(--bg);border:1px solid var(--border);
    border-radius:6px;color:var(--text);padding:.45rem .6rem;font-size:.8rem;outline:none;font-family:inherit}
  .modal input:focus{border-color:var(--accent)}
  .modal .btn-group{display:flex;gap:.4rem;justify-content:flex-end;margin-top:1rem}

  /* Toast */
  .toast{position:fixed;bottom:1.5rem;right:1.5rem;padding:.6rem 1rem;background:var(--surface);
    border:1px solid var(--green);border-radius:8px;color:var(--green);font-size:.8rem;
    opacity:0;transition:opacity .25s;pointer-events:none;z-index:100}
  .toast.show{opacity:1}.toast.err{border-color:var(--red);color:var(--red)}

  /* Pages */
  .page{display:none}.page.active{display:block}

  /* Gateway page */
  .info-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin-bottom:.75rem}
  .info-card .title{font-size:.82rem;font-weight:600;margin-bottom:.5rem}
  .info-row{display:flex;justify-content:space-between;padding:.25rem 0;font-size:.8rem}
  .info-row .label{color:var(--dim)}

  .sep{border:none;border-top:1px solid var(--border);margin:1rem 0}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">⚡ <span>UClaW</span></div>
    <nav>
      <div class="nav-item active" data-page="switch">🔄 模型切换</div>
      <div class="nav-item" data-page="keys">🔑 API 配置</div>
      <div class="nav-item" data-page="add">➕ 添加提供商</div>
      <div class="nav-item" data-page="gateway">🌐 Gateway</div>
    </nav>
    <div class="version">OpenClaw v2026.6.1 · Portable</div>
  </aside>

  <div class="main">
    <!-- Switch Page -->
    <div id="page-switch" class="page active">
      <div class="page-title">
        模型切换
        <div class="status-bar" id="gwChip"></div>
      </div>
      <div class="provider-grid" id="providerGrid"></div>
    </div>

    <!-- API Keys Page -->
    <div id="page-keys" class="page">
      <div class="page-title">API 配置</div>
      <div id="keysList"></div>
    </div>

    <!-- Add Provider Page -->
    <div id="page-add" class="page">
      <div class="page-title">添加提供商</div>
      <div class="info-card">
        <div class="form-row"><label class="form-label">提供商 ID</label>
          <input id="n-id" placeholder="my-provider"></div>
        <div class="form-row"><label class="form-label">显示名称</label>
          <input id="n-name" placeholder="My Provider"></div>
        <div class="form-row"><label class="form-label">分类</label>
          <select id="n-cat">
            <option value="cn_official">国内官方</option>
            <option value="official">国际官方</option>
            <option value="proxy">中转代理</option>
            <option value="custom">自定义</option>
          </select></div>
        <div class="form-row"><label class="form-label">API Base URL</label>
          <input id="n-url" placeholder="https://api.example.com/v1"></div>
        <div class="form-row"><label class="form-label">API 类型</label>
          <select id="n-api">
            <option value="openai-completions">OpenAI Completions</option>
            <option value="openai-responses">OpenAI Responses</option>
            <option value="openai-chatgpt-responses">ChatGPT Responses</option>
            <option value="anthropic-messages">Anthropic Messages</option>
            <option value="google-generative-ai">Google Generative AI</option>
          </select></div>
        <div class="form-row"><label class="form-label">API Key</label>
          <input id="n-key" type="password" placeholder="sk-..."></div>
        <div class="form-row"><label class="form-label">模型 ID</label>
          <input id="n-mid" placeholder="gpt-4o"></div>
        <div class="form-row"><label class="form-label">模型名称</label>
          <input id="n-mname" placeholder="GPT-4o"></div>
        <button class="btn btn-primary" onclick="addProvider()">添加</button>
      </div>
    </div>

    <!-- Gateway Page -->
    <div id="page-gateway" class="page">
      <div class="page-title">Gateway 状态</div>
      <div class="info-card" id="gwInfo">加载中...</div>
      <div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.5rem">
        <a class="btn" id="gwLink" href="http://localhost:18789/" target="_blank">🎛️ OpenClaw 控制台</a>
        <button class="btn" onclick="location.reload()">🔄 刷新面板</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-bg" id="keyModal">
  <div class="modal">
    <h3>修改 API Key</h3>
    <div class="form-row"><label class="form-label">提供商</label><div id="km-name" style="font-weight:600"></div></div>
    <div class="form-row"><label class="form-label">新的 API Key</label>
      <input id="km-key" type="password" placeholder="sk-..."></div>
    <div class="btn-group">
      <button class="btn" onclick="closeModal('keyModal')">取消</button>
      <button class="btn btn-primary" onclick="saveKey()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = location.origin;
let providers = [], editId = '';

// ── Nav ──
document.querySelectorAll('.nav-item').forEach(el => el.onclick = () => {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + el.dataset.page).classList.add('active');
});

// ── Helpers ──
async function api(path, opts = {}) {
  const r = await fetch(API + path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  return r.json();
}
function toast(msg, err = false) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
  setTimeout(() => t.className = 'toast', 3000);
}
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
const catLabel = c => ({ official: '官方', cn_official: '国内', proxy: '中转', custom: '自定义', international: '国际' })[c] || c;
const catClass = c => ({ official: 'official', cn_official: 'cn', proxy: 'proxy', international: 'intl' })[c] || '';

// ── Gateway ──
async function checkGateway() {
  const chip = document.getElementById('gwChip');
  const info = document.getElementById('gwInfo');
  try {
    const d = await api('/api/gateway');
    chip.innerHTML = `<span class="status-chip ${d.online ? 'ok' : 'err'}"><span class="dot ${d.online ? 'ok' : 'err'}"></span>${d.online ? 'Gateway 在线' : 'Gateway 离线'}</span>`;
    info.innerHTML = `<div class="info-row"><span class="label">状态</span><span style="color:${d.online ? 'var(--green)' : 'var(--red)'}">${d.online ? '● 在线' : '● 离线'}</span></div>
      <div class="info-row"><span class="label">端口</span><span>${d.port}</span></div>
      ${d.status ? `<div class="info-row"><span class="label">Health</span><span>${d.status}</span></div>` : ''}
      <div style="margin-top:.75rem"><a class="btn btn-sm" href="http://localhost:${d.port}/" target="_blank">打开控制台 →</a></div>`;
    document.getElementById('gwLink').href = `http://localhost:${d.port}/`;
  } catch {
    chip.innerHTML = '<span class="status-chip err"><span class="dot err"></span>面板离线</span>';
  }
}

// ── Load Providers ──
async function loadProviders() {
  providers = await api('/api/providers');
  renderSwitch();
  renderKeys();
}

function renderSwitch() {
  const grid = document.getElementById('providerGrid');
  grid.innerHTML = providers.map(p => {
    const active = p.isCurrent;
    const models = (p.models || []).map(m => {
      const tags = (m.tags || []).map(t => `<span class="tag ${t === '免费' ? 'free' : t === '推理' ? 'reasoning' : ''}">${t}</span>`).join('');
      return `<div style="display:flex;align-items:center;gap:.4rem">${m.name} <span style="color:var(--dim);font-size:.68rem">(${m.id})</span> ${tags}</div>`;
    }).join('');
    return `<div class="provider-card ${active ? 'active' : ''}" onclick="switchProvider('${p.id}','${p.name}')">
      <div class="p-icon" style="background:${p.iconColor || '#666'}">${(p.name || p.id).charAt(0).toUpperCase()}</div>
      <div class="p-info">
        <div class="p-name">${p.nameZh || p.name} <span class="cat ${catClass(p.category)}">${catLabel(p.category)}</span></div>
        <div class="p-url">${p.baseUrl}</div>
        <div class="p-models">${models}</div>
      </div>
      <div class="p-right">
        ${active ? '<span class="p-badge active">✓ 当前</span>' : ''}
        <span class="p-badge ${p.hasKey ? 'key-ok' : 'key-miss'}">${p.hasKey ? '🔑 已配置' : '⚠ 缺 Key'}</span>
      </div>
    </div>`;
  }).join('') + `<div class="add-card" onclick="document.querySelector('[data-page=add]').click()">➕ 添加新的模型提供商</div>`;
}

// ── Switch ──
async function switchProvider(id, name) {
  const p = providers.find(x => x.id === id);
  if (p?.isCurrent) return;
  if (!p?.hasKey) {
    if (!confirm(`${name} 尚未配置 API Key，确定切换？`)) return;
  }
  try {
    const r = await api(`/api/providers/${encodeURIComponent(id)}/switch`, { method: 'PUT' });
    if (r.ok) { toast('✓ 已切换到 ' + name); loadProviders(); }
    else toast('切换失败: ' + (r.error || ''), true);
  } catch (e) { toast('切换失败: ' + e.message, true); }
}

// ── Keys Page ──
function renderKeys() {
  document.getElementById('keysList').innerHTML = providers.map(p => `
    <div class="info-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem">
        <div style="display:flex;align-items:center;gap:.5rem">
          <div class="p-icon" style="background:${p.iconColor || '#666'};width:28px;height:28px;font-size:.75rem">${(p.name||p.id).charAt(0)}</div>
          <div>
            <div style="font-weight:600;font-size:.85rem">${p.nameZh || p.name}</div>
            <div style="font-size:.7rem;color:var(--dim);font-family:monospace">${p.id}</div>
          </div>
        </div>
        <div style="display:flex;gap:.3rem">
          <button class="btn btn-sm" onclick="editKey('${p.id}')">修改 Key</button>
          <button class="btn btn-sm btn-danger" onclick="delProvider('${p.id}')">删除</button>
        </div>
      </div>
      <div class="info-row"><span class="label">Base URL</span><span style="font-family:monospace;font-size:.75rem">${p.baseUrl}</span></div>
      <div class="info-row"><span class="label">API Key</span>
        <span style="font-family:monospace;font-size:.75rem;color:${p.hasKey ? 'var(--green)' : 'var(--red)'}">${p.apiKey || '(未设置)'}</span></div>
      <div class="info-row"><span class="label">API 类型</span><span>${p.api}</span></div>
      <div class="info-row"><span class="label">模型</span><span style="font-size:.75rem">${(p.models||[]).map(m=>m.id).join(', ')}</span></div>
    </div>`).join('');
}

// ── Edit Key ──
function editKey(id) {
  editId = id;
  const p = providers.find(x => x.id === id);
  document.getElementById('km-name').textContent = p.nameZh || p.name;
  document.getElementById('km-key').value = '';
  openModal('keyModal');
  document.getElementById('km-key').focus();
}
async function saveKey() {
  const key = document.getElementById('km-key').value.trim();
  if (!key) return toast('请输入 API Key', true);
  try {
    await api(`/api/providers/${encodeURIComponent(editId)}`, {
      method: 'PATCH', body: JSON.stringify({ apiKey: key })
    });
    closeModal('keyModal');
    loadProviders();
    toast('✓ API Key 已更新');
  } catch (e) { toast('保存失败: ' + e.message, true); }
}

// ── Add Provider ──
async function addProvider() {
  const id = document.getElementById('n-id').value.trim();
  const baseUrl = document.getElementById('n-url').value.trim();
  if (!id || !baseUrl) return toast('请填写 ID 和 URL', true);
  try {
    await api('/api/providers', { method: 'POST', body: JSON.stringify({
      id, name: document.getElementById('n-name').value || id,
      category: document.getElementById('n-cat').value,
      baseUrl, api: document.getElementById('n-api').value,
      apiKey: document.getElementById('n-key').value,
      models: [{ id: document.getElementById('n-mid').value || 'default',
                 name: document.getElementById('n-mname').value || 'Default', tags: [] }]
    })});
    toast('✓ 已添加: ' + id);
    ['n-id','n-name','n-url','n-key','n-mid','n-mname'].forEach(i => document.getElementById(i).value = '');
    loadProviders();
  } catch (e) { toast('添加失败: ' + e.message, true); }
}

// ── Delete ──
async function delProvider(id) {
  if (!confirm('确定删除 ' + id + '？')) return;
  try {
    await api(`/api/providers/${encodeURIComponent(id)}`, { method: 'DELETE' });
    loadProviders(); toast('✓ 已删除');
  } catch (e) { toast('删除失败', true); }
}

// ── Init ──
checkGateway(); loadProviders(); setInterval(checkGateway, 15000);
</script>
</body>
</html>
